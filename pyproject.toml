[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-ssrf-defense-lab"
version = "0.1.0"
description = "Evaluation harness for SSRF defense: deterministic context-aware defender scored against a traditional rule-based baseline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Chen Po-Cheng" }
]
license = { text = "MIT" }
keywords = ["ssrf", "llm", "security", "benchmark", "defense"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
